stages:
  - ingest

ingest_job:
  stage: ingest
  image: python:3.11-slim
  rules:
    - if: $TARGET_REPO_URL
  before_script:
    - apt-get update && apt-get install -y git build-essential curl zstd
    - pip install --no-cache-dir -r requirements.txt
    - |
      if [ "$EMBEDDING_PROVIDER" != "modal" ]; then
        echo "Local Ollama provider selected. Installing Ollama..."
        mkdir -p .ollama && export OLLAMA_MODELS="$(pwd)/.ollama"
        if ! command -v ollama &> /dev/null; then curl -fsSL https://ollama.com/install.sh | sh; fi
        ollama serve > /dev/null 2>&1 &
        sleep 5
        if ! ollama list | grep -q "embeddinggemma"; then ollama pull embeddinggemma; fi
      else
        echo "Modal embedding provider selected. Skipping local Ollama setup."
      fi
  script:
    - export PYTHONUNBUFFERED=1
    - python -u cli.py

